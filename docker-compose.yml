services:
  api:
    build:
      context: .
      target: ${BUILD_TARGET:-cpu}
    container_name: myna-api
    ports:
      - "8000:8000"
    volumes:
      # Persist uploaded videos, database, and tmp files
      - myna-storage:/app/storage
      # Cache ML models (faster-whisper, pyannote) so they survive restarts
      - myna-models:/root/.cache
      # tmpfs for temporary wav files (extracted audio) — faster, ephemeral
      - type: tmpfs
        target: /app/storage/tmp
        tmpfs:
          size: 2G
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cuda}
      - TRANSCRIBER_PROVIDER=${TRANSCRIBER_PROVIDER:-local}
      - DIARIZER_PROVIDER=${DIARIZER_PROVIDER:-local}
      # Phase 1: chunking / VAD toggles
      - ENABLE_VAD=${ENABLE_VAD:-true}
      - ENABLE_CHUNKING=${ENABLE_CHUNKING:-true}
      # Optional overrides for storage paths (defaults use /app/storage/)
      - STORAGE_DIR=${STORAGE_DIR:-}
      - DATABASE_URL=${DATABASE_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Resource limits (CPU-only fallback)
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"
    profiles: [""]

  api-gpu:
    build:
      context: .
      target: gpu
    container_name: myna-api-gpu
    ports:
      - "8000:8000"
    volumes:
      - myna-storage:/app/storage
      - myna-models:/root/.cache
      - type: tmpfs
        target: /app/storage/tmp
        tmpfs:
          size: 4G
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cuda}
      - TRANSCRIBER_PROVIDER=${TRANSCRIBER_PROVIDER:-local}
      - DIARIZER_PROVIDER=${DIARIZER_PROVIDER:-local}
      - ENABLE_VAD=${ENABLE_VAD:-true}
      - ENABLE_CHUNKING=${ENABLE_CHUNKING:-true}
      - STORAGE_DIR=${STORAGE_DIR:-}
      - DATABASE_URL=${DATABASE_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: [gpu]

volumes:
  myna-storage:
  myna-models:
